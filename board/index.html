<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사무실 상황판</title>
<!-- 6단계 사무실 상황판 v7 (2026-11-29, 시험(TEST) 데이터는 🧪 줄무늬로 구분, 발주서·발주 필요 수에서 뺌) · v6 (2026-11-28, ⚙ 관리에 부족 알림 메일(관리자·운영자, 대문과 같은 값) · 작업 진행: 코일기록·코일등록 완료를 한 줄에 같이): PC·큰 모니터용. 스크롤 없이 한 화면, 1분마다 새로고침, 화면 크기에 맞춰 글씨가 커짐. 보기만 하는 화면 -->
<link rel="icon" href="../icon-192.png">
<meta name="theme-color" content="#1f6fb2">
<style>
  :root { --bg:#eef1f5; --card:#fff; --ink:#1d2430; --sub:#5b6677; --line:#d5dae1; --blue:#1f6fb2; --blue2:#6fa8dc; --org:#d9730d; --grn:#2e7d32; --red:#c62828; }
  * { box-sizing:border-box; }
  /* 화면 크기에 맞춰 모든 글씨·칸이 같이 커짐 (1920×1080 기준 1rem ≈ 19px) */
  html { font-size:min(1vw, 1.78vh); }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  button { font:inherit; cursor:pointer; border:0; border-radius:.6rem; }
  .hide { display:none !important; }
  #board { height:100vh; overflow:hidden; display:grid; gap:.8rem; padding:.8rem; grid-template-rows:auto auto 1fr 1.08fr; }
  header { display:flex; align-items:center; gap:1rem; }
  header h1 { font-size:2.1rem; margin:0; }
  header .time { font-size:1.3rem; color:var(--sub); }
  header .sp { flex:1; }
  header button { font-size:1.2rem; padding:.6rem 1.1rem; background:var(--blue); color:#fff; font-weight:700; }
  header button.g { background:#dfe4ea; color:var(--ink); }
  .notice { margin-top:.6rem; background:#fff4d6; border:2px solid #f0b400; border-radius:.8rem; padding:.4rem 1rem; font-size:1.9rem; font-weight:800; text-align:center; }
  .pane .fl { display:block; margin:.8rem 0 .2rem; font-weight:700; }
  .pane input[type=text], .pane input[type=date], .pane input[type=number] { font-size:1.25rem; padding:.4rem .6rem; border:2px solid var(--line); border-radius:.5rem; }
  .pane .opts { display:flex; gap:.5rem; flex-wrap:wrap; }
  .pane .opts button { font-size:1.15rem; padding:.45rem .9rem; background:#eef1f5; color:var(--ink); border:2px solid var(--line); }
  .pane .opts button.on { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700; }
  .pane section { border-top:1px solid var(--line); padding-top:.4rem; margin-top:.8rem; }
  .card { background:var(--card); border-radius:1rem; padding:.9rem 1.1rem; box-shadow:0 1px 4px rgba(0,0,0,.08); min-height:0; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  .card h2 { font-size:1.45rem; margin:0 0 .3rem; display:flex; gap:.8rem; align-items:baseline; }
  .card h2 small { font-size:1rem; color:var(--sub); font-weight:400; }
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:.8rem; }
  .kpi { background:var(--card); border-radius:1rem; padding:.45rem 1.2rem; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .kpi .l { font-size:1.35rem; color:var(--sub); }
  .kpi .v { font-size:3.1rem; font-weight:800; line-height:1.1; }
  .kpi .v small { font-size:1.6rem; font-weight:700; margin-left:.3rem; }
  .kpi.red .v { color:var(--red); }
  .row { display:grid; gap:.8rem; min-height:0; }
  .r1 { grid-template-columns:1.5fr 1fr; }
  .r2 { grid-template-columns:1.5fr 1fr; }
  /* 막대그래프 */
  .bars { flex:1; display:flex; align-items:flex-end; gap:.35rem; min-height:0; padding-top:1.6rem; border-bottom:2px solid var(--line); position:relative; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; position:relative; }
  .bar .col { width:78%; background:var(--blue); border-radius:.3rem .3rem 0 0; position:relative; }
  .bar.inv .col { background:var(--blue2); }
  .bar.low .col { background:var(--red); }
  .bar.test .col { background:repeating-linear-gradient(45deg,#c9a227 0 .35rem,#e8d27a .35rem .7rem); }
  .bar.test .val { color:#9a7a10; }
  .xl div.test { color:#9a7a10; }
  .tbadge { display:inline-block; font-size:.8em; background:#fff3c4; color:#7a5c00; border-radius:.3rem; padding:0 .3rem; margin-left:.2rem; }
  .bar .val { font-size:1rem; font-weight:700; white-space:nowrap; }
  .bar.low .val { color:var(--red); }
  .bar .safe { position:absolute; left:4%; right:4%; border-top:2px dashed var(--org); }
  .xl { display:flex; gap:.35rem; }
  .xl div { flex:1; text-align:center; font-size:.95rem; font-weight:700; min-width:0; white-space:nowrap; overflow:hidden; }
  .xl div.inv { color:#3d7fb8; }
  .legend { font-size:1rem; color:var(--sub); display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:.35rem; }
  .legend i { display:inline-block; width:1rem; height:1rem; border-radius:.2rem; vertical-align:-.15rem; margin-right:.3rem; }
  .inroll { font-size:1.15rem; margin-top:.35rem; }
  .inroll b { font-size:1.3rem; }
  .inroll .low { color:var(--red); }
  /* 월별 사용량 (쌓은 막대) */
  .mbig { font-size:2.4rem; font-weight:800; }
  .mbig small { font-size:1.2rem; color:var(--sub); font-weight:400; margin-left:.5rem; }
  .mbars { flex:1; display:flex; align-items:flex-end; gap:1rem; min-height:0; padding-top:1.5rem; border-bottom:2px solid var(--line); }
  .mbar { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
  .mbar .stack { width:70%; display:flex; flex-direction:column-reverse; }
  .mbar .stack div { width:100%; }
  .mbar .val { font-size:1.05rem; font-weight:700; }
  .mx { display:flex; gap:1rem; }
  .mx div { flex:1; text-align:center; font-size:1.05rem; font-weight:700; }
  .mx div.now { color:var(--blue); }
  /* 표 */
  table { width:100%; border-collapse:collapse; font-size:1.2rem; }
  th { text-align:left; color:var(--sub); font-weight:400; font-size:1.05rem; border-bottom:2px solid var(--line); padding:.15rem .4rem; }
  #recent td { font-size:1.1rem; padding:.04rem .4rem; line-height:1.32; }
  td { border-bottom:1px solid #edf0f3; padding:.2rem .4rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:18rem; }
  td.n { text-align:right; font-weight:700; }
  .stk { font-size:1.4rem; padding:.6rem .8rem; border-radius:.7rem; background:#f4f7fb; cursor:pointer; border:2px solid var(--line); text-align:left; width:100%; }
  .stk b.bad { color:var(--red); }
  .stk b.ok { color:var(--grn); }
  .st { font-weight:800; }
  .st.ok { color:var(--grn); }
  .st.no { color:var(--org); }
  #recent tr.done td { background:#eef8ef; }
  #recent td.pg { max-width:none; }
  #recent td.sp { max-width:11rem; }
  .soon { font-size:1.2rem; margin-top:.6rem; overflow:hidden; }
  .soon div { padding:.15rem 0; border-bottom:1px solid #edf0f3; display:flex; justify-content:space-between; }
  .soon .w { font-weight:800; }
  .soon .w.red { color:var(--red); }
  .empty { color:var(--sub); font-size:1.2rem; padding:1rem 0; }
  #msg { position:fixed; bottom:.6rem; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:.5rem 1rem; border-radius:.5rem; font-size:1.1rem; }
  /* 겹쳐 뜨는 창 (재고조사 상세·발주서·포스코 표) */
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:9; }
  .pane { background:#fff; border-radius:1rem; width:min(92vw, 70rem); max-height:92vh; overflow:auto; padding:1.4rem 1.6rem; font-size:1.25rem; }
  .pane h3 { font-size:1.8rem; margin:0 0 .8rem; }
  .pane .btns { position:sticky; bottom:-1.4rem; background:#fff; padding:.6rem 0; display:flex; gap:.8rem; justify-content:flex-end; margin-top:1rem; }
  .pane .btns button { font-size:1.25rem; padding:.7rem 1.3rem; background:var(--blue); color:#fff; font-weight:700; }
  .pane .btns button.g { background:#dfe4ea; color:var(--ink); }
  .pane td { white-space:normal; max-width:none; }
  .pane td[contenteditable] { background:#fffbe6; outline:1px dashed #e0c060; }
  .pane .note { color:var(--sub); font-size:1.05rem; margin:.5rem 0; }
  /* 로그인 */
  #login { max-width:30rem; margin:12vh auto; background:#fff; border-radius:1rem; padding:2rem; font-size:1.5rem; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  #login input { width:100%; font-size:1.6rem; padding:.6rem; margin:.3rem 0 1rem; border:2px solid var(--line); border-radius:.6rem; }
  #login button { width:100%; font-size:1.6rem; padding:.8rem; background:var(--blue); color:#fff; font-weight:700; }
  /* 인쇄: 발주서·포스코 표만 */
  @media print {
    html { font-size:12px; }
    body { background:#fff; }
    #board, #login, #msg { display:none !important; }
    .ov { position:static; background:none; display:block; }
    .pane { width:auto; max-height:none; overflow:visible; box-shadow:none; padding:0; }
    .pane .btns, .pane .noprint { display:none !important; }
    .pane td[contenteditable] { background:none; outline:none; }
    table { font-size:12px; } th, td { border:1px solid #888; padding:4px 6px; }
  }
</style>
</head>
<body>
<div id="login" class="hide">
  <h2 style="margin-top:0">🖥️ 사무실 상황판</h2>
  <div>이름</div><input id="lName" autocomplete="username">
  <div>PIN</div><input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">들어가기</button>
  <p id="lMsg" style="color:var(--red);font-size:1.2rem"></p>
</div>

<div id="board" class="hide">
  <div><header>
    <h1>🖥️ 권선 작업실 상황판</h1>
    <span class="time" id="time"></span>
    <span class="sp"></span>
    <button onclick="openOrder()">🧾 발주서 만들기</button>
    <button onclick="openPosco()">📋 포스코 등록표</button>
    <button class="g" onclick="load()">🔄 새로고침</button>
    <button class="g hide" id="admBtn" onclick="openAdmin()">⚙ 관리</button>
  </header>
  <div id="notice" class="notice hide"></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">총 재고</div><div class="v" id="k1">-</div></div>
    <div class="kpi"><div class="l" id="k2l">이번 달 사용량</div><div class="v" id="k2">-</div></div>
    <div class="kpi" id="k3box"><div class="l">발주 필요 규격</div><div class="v" id="k3">-</div></div>
  </div>
  <div class="row r1" id="r1">
    <div class="card" id="cStock">
      <h2>규격별 재고 <small>AIW·인버터 · 주황 점선 = 알림 기준 · 빨강 = 기준 아래</small></h2>
      <div class="bars" id="bars"></div>
      <div class="xl" id="xl"></div>
      <div class="inroll" id="inroll"></div>
    </div>
    <div class="card" id="cMonthly">
      <h2>월별 사용량</h2>
      <div class="mbig" id="mbig">-</div>
      <div class="mbars" id="mbars"></div>
      <div class="mx" id="mx"></div>
      <div class="legend" id="mleg"></div>
    </div>
  </div>
  <div class="row r2" id="r2">
    <div class="card" id="cRecent">
      <h2>작업 진행 <small>작업번호로 맞춤 · 작업기록 앱에 기록 → 코일 앱에서 코일 쓰기</small></h2>
      <div style="flex:1;min-height:0;overflow:hidden"><table><thead><tr><th>작업번호</th><th>날짜</th><th>작업자</th><th>kW</th><th>진행</th><th style="text-align:right">코일</th><th>선경</th></tr></thead><tbody id="recent"></tbody></table></div>
    </div>
    <div class="card" id="cSide">
      <h2 id="sideH">재고조사 · 소진 예측</h2>
      <button class="stk" id="stk" onclick="openStk()">-</button>
      <div class="soon" id="soon"></div>
    </div>
  </div>
</div>
<div id="ov" class="ov hide" onclick="if(event.target===this)closeOv()"><div class="pane" id="pane"></div></div>
<div id="msg" class="hide"></div>

<script src="../auth.js"></script>
<script>
var API = 'https://difrlthubqaoeqyprhhj.supabase.co/functions/v1/api';
var D = null, TIMER = null;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function tok() { return ls('coilinv_token') || ls('wr_token') || ''; }
function nf(n, d) { n = Number(n) || 0; return n.toLocaleString('ko-KR', { maximumFractionDigits: d == null ? 1 : d }); }
function msg(t, ms) { var m = $('msg'); m.textContent = t; m.classList.remove('hide'); clearTimeout(msg.t); msg.t = setTimeout(function () { m.classList.add('hide'); }, ms || 3000); }
function call(fn, args) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ app: 'co', fn: fn, args: args || [] }) })
    .then(function (r) { return r.json(); }).then(function (j) { if (j && j.ok) return j.v; throw new Error(String((j && j.e) || '서버 응답이 이상합니다')); });
}
function showLogin(t) { $('board').classList.add('hide'); $('login').classList.remove('hide'); $('lName').value = (window.GW && GW.name()) || ''; $('lMsg').textContent = t || ''; }
function doLogin() {
  var n = $('lName').value.trim(), p = $('lPin').value.trim(); if (!n || !p) return;
  $('lMsg').textContent = '확인 중…';
  GW.login(n, p).then(function () { $('lPin').value = ''; $('login').classList.add('hide'); load(); }, function (e) { $('lMsg').textContent = e.message; });
}
function load() {
  if (!tok()) { showLogin(); return; }
  call('board', [tok()]).then(function (d) { D = d; $('login').classList.add('hide'); $('board').classList.remove('hide'); render(); }, function (e) {
    if (/로그인|출입증/.test(e.message)) showLogin('다시 로그인해 주세요'); else msg('새로고침 실패: ' + e.message + ' (1분 뒤 다시 시도)', 5000);
  });
}
// ── 그리기 ──
var KIND_ORDER = { AIW: 0, '인버터': 1 };
function isInroll(s) { return s.type && s.type !== '일반 환선'; }
function specNum(s) { var n = parseFloat(String(s).replace(/[^0-9.]/g, '')); return isFinite(n) ? n : 999; }
// v7: 시험용(TEST) 코일·작업 — 보이게 두되 구분. 발주서·발주 필요 수·소진 예측에는 안 넣음
function isTest(s) { return String(s && s.kind || '').toUpperCase() === 'TEST'; }
function isTestNo(no) { return /^TEST-/i.test(String(no || '')); }
function lows() { return (D.stock || []).filter(function (s) { return s.low && !isTest(s); }); }
function C() { return D.cfg || {}; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function layout() {
  var sh = C().show || {}, on = function (k) { return sh[k] !== false; };
  $('cStock').classList.toggle('hide', !on('stock')); $('cMonthly').classList.toggle('hide', !on('monthly')); $('cRecent').classList.toggle('hide', !on('recent'));
  $('stk').classList.toggle('hide', !on('stk')); $('soon').classList.toggle('hide', !on('soon')); $('cSide').classList.toggle('hide', !on('stk') && !on('soon'));
  $('sideH').textContent = on('stk') && on('soon') ? '재고조사 · 소진 예측' : on('stk') ? '재고조사' : '소진 예측';
  var rows = ['auto', 'auto'];
  [['r1', on('stock'), on('monthly'), '1fr'], ['r2', on('recent'), on('stk') || on('soon'), '1.08fr']].forEach(function (r) {
    var el = $(r[0]); el.classList.toggle('hide', !r[1] && !r[2]); el.style.gridTemplateColumns = r[1] && r[2] ? '' : '1fr';
    if (r[1] || r[2]) rows.push(r[3]);
  });
  $('board').style.gridTemplateRows = rows.join(' ');
  var c = C(), nt = c.notice && (!c.noticeUntil || todayStr() <= c.noticeUntil);
  $('notice').classList.toggle('hide', !nt); $('notice').textContent = nt ? '📢 ' + c.notice : '';
  $('admBtn').classList.toggle('hide', !(D.me && (D.me.admin || D.me.owner)));
}
function basis() { return C().basis === 6 ? 6 : 3; }
// 공지 줄 등으로 자리가 모자라면 안 보이는 아래 줄은 숨김 (반쯤 잘린 줄 없게)
function fitRecent() {
  var box = $('cRecent'), tb = $('recent'); if (!box || box.classList.contains('hide')) return;
  [].forEach.call(tb.rows, function (r) { r.style.display = ''; });
  var bot = box.getBoundingClientRect().bottom - 6;
  [].forEach.call(tb.rows, function (r) { if (r.getBoundingClientRect().bottom > bot) r.style.display = 'none'; });
}
window.addEventListener('resize', function () { if (D) fitRecent(); });
function render() {
  layout(); setTimeout(fitRecent, 0);
  var st = D.stock || [], round = st.filter(function (s) { return !isInroll(s); }), inr = st.filter(isInroll);
  $('time').textContent = D.at + ' 기준 · 1분마다 새로고침';
  var tot = st.reduce(function (a, s) { return a + (Number(s.total) || 0); }, 0);
  var ttot = st.filter(isTest).reduce(function (a, s) { return a + (Number(s.total) || 0); }, 0);
  $('k1').innerHTML = nf(tot, 0) + '<small>kg' + (ttot ? ' <span class="tbadge">🧪 시험 ' + nf(ttot, 0) + ' 포함</span>' : '') + '</small>';
  var mo = D.monthly || { months: [], total: {} }, cur = mo.months[0], mt = (mo.total[cur] || {});
  $('k2l').textContent = (cur ? Number(cur.slice(5)) + '월' : '이번 달') + ' 사용량';
  $('k2').innerHTML = nf(mt.used || 0, 0) + '<small>kg</small>';
  var L = lows(); $('k3').innerHTML = L.length + '<small>개</small>'; $('k3box').classList.toggle('red', L.length > 0);
  // 규격별 재고 (AIW·인버터 한 그래프)
  round.sort(function (a, b) { return (KIND_ORDER[a.kind] == null ? 9 : KIND_ORDER[a.kind]) - (KIND_ORDER[b.kind] == null ? 9 : KIND_ORDER[b.kind]) || specNum(a.spec) - specNum(b.spec); });
  var mx = Math.max.apply(null, round.map(function (s) { return Math.max(Number(s.total) || 0, Number(s.safety) || 0); }).concat([1]));
  $('bars').innerHTML = round.length ? round.map(function (s) {
    var h = (Number(s.total) || 0) / mx * 88, sf = s.safety != null ? (Number(s.safety) / mx * 88) : null, inv = s.kind !== 'AIW', tt = isTest(s);
    return '<div class="bar' + (tt ? ' test' : inv ? ' inv' : '') + (s.low && !tt ? ' low' : '') + '" title="' + esc(s.kind + ' ' + s.spec) + '"><div class="val">' + nf(s.total, 0) + '</div><div class="col" style="height:' + h + '%"></div>' +
      (sf != null ? '<div class="safe" style="bottom:' + sf + '%"></div>' : '') + '</div>';
  }).join('') : '<div class="empty">아직 재고가 없습니다</div>';
  $('xl').innerHTML = round.map(function (s) { return '<div class="' + (isTest(s) ? 'test' : s.kind !== 'AIW' ? 'inv' : '') + '">' + esc(s.spec) + (s.kind !== 'AIW' ? '<br>' + (isTest(s) ? '🧪TEST' : esc(s.kind === '인버터' ? '인버터' : s.kind)) : '') + '</div>'; }).join('');
  $('inroll').innerHTML = inr.length ? '🌀 인롤 ' + inr.map(function (s) { return '<span class="' + (s.low ? 'low' : '') + '"><b>' + esc(s.type.replace(/^인롤\s*/, '')) + '</b> ' + (s.unit ? (s.units || 0) + '대분 · ' : '') + nf(s.total, 0) + 'kg</span>'; }).join(' &nbsp;·&nbsp; ') : '';
