<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>권선 작업실</title>
<!-- 깃허브 시험판 (2026-11-26): 구글 사이트 대신 깃허브 페이지에 올려 속도 비교. 홈 화면에 추가하면 앱처럼 열림 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f6fb2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#f2f4f7;--ink:#1d2430;--sub:#5b6677;--wait:#e3e6eb;--waitink:#8a93a1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  /* 글자·박스 크기를 화면 폭(vw)에 맞춰서, 어떤 휴대폰에서도 스크롤 없이 한 화면에 */
  .wrap{position:relative;padding:3vw 4.5vw 3vw}
  .brand{text-align:center;font-size:3.6vw;font-weight:700;letter-spacing:.3vw;color:#8a93a1;margin-bottom:1vw}
  h1{margin:0;font-size:9vw;text-align:center;letter-spacing:-.3vw;line-height:1.2}
  .date{text-align:center;color:var(--sub);font-size:4.4vw;margin:1vw 0 5vw}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4vw}
  .room{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:44vw;border-radius:5vw;border:0;padding:2vw;cursor:pointer;
    font:inherit;color:#fff;box-shadow:0 .8vw 2vw rgba(0,0,0,.15)}
  .room:active{transform:scale(.97)}
  .room .ic{font-size:13vw;line-height:1;margin-bottom:2.5vw}
  .room .nm{font-size:7vw;font-weight:700;line-height:1.2;text-align:center}
  .coil{background:#d9730d}
  .work{background:#1f6fb2}
  .wait{background:var(--wait);color:var(--waitink);box-shadow:none;border:.8vw dashed #c3c9d2}
  .wait .nm{font-size:6vw}
  /* v7: 설정은 오른쪽 위 톱니바퀴 아이콘만 */
  .gear{position:absolute;top:2.5vw;right:3vw;width:11vw;height:11vw;display:flex;align-items:center;justify-content:center;
    border:0;border-radius:50%;background:transparent;color:#5b6677;font:inherit;font-size:7.5vw;line-height:1;cursor:pointer;padding:0}
  .gear:active{transform:scale(.97)}
  .help{display:flex;align-items:center;justify-content:center;gap:2vw;margin-top:4vw;height:8vw;border-radius:2.5vw;
    background:#2e7d32;color:#fff;text-decoration:none;box-shadow:0 .8vw 2vw rgba(0,0,0,.15)}
  .help:active{transform:scale(.97)}
  .help .ph{font-size:4.2vw;line-height:1}
  .help .tx{font-size:3.8vw;font-weight:700;letter-spacing:.1vw}
  .toast{position:fixed;left:50%;bottom:6vw;transform:translateX(-50%);white-space:nowrap;
    background:#1d2430;color:#fff;padding:3.5vw 6vw;border-radius:3vw;font-size:5vw;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <button class="gear" data-url="https://sites.google.com/view/gwonseon-home/settings" aria-label="설정" title="설정">⚙</button>
  <div class="brand">POSCO GY솔루션</div>
  <h1>🔧 권선 작업실</h1>
  <div class="date" id="d"></div>
  <div class="grid">
    <button class="room coil" data-url="./coil/">
      <span class="ic">🧵</span><span class="nm">코일 관리</span></button>
    <button class="room work" data-url="./worklog/">
      <span class="ic">📒</span><span class="nm">작업기록</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
  </div>
</div>
<div class="toast" id="t">아직 만드는 중입니다</div>
<script>
  var n=new Date(),w='일월화수목금토';
  document.getElementById('d').textContent=(n.getMonth()+1)+'월 '+n.getDate()+'일 ('+w[n.getDay()]+')';
  var t=document.getElementById('t'),tm;
  function go(u){
    try{ window.top.location.href=u; }
    catch(e){ window.open(u,'_blank'); }
  }
  document.querySelectorAll('.room,.gear').forEach(function(b){
    b.addEventListener('click',function(){
      var u=b.getAttribute('data-url');
      if(u){ go(u); return; }
      t.classList.add('on'); clearTimeout(tm); tm=setTimeout(function(){t.classList.remove('on')},1500);
    });
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
