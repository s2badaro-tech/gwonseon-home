<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>권선 작업실</title>
<!-- 깃허브 시험판 (2026-11-26): 구글 사이트 대신 깃허브 페이지에 올려 속도 비교. 홈 화면에 추가하면 앱처럼 열림 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="권선 작업실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f6fb2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#f2f4f7;--ink:#1d2430;--sub:#5b6677;--wait:#e3e6eb;--waitink:#8a93a1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  /* 글자·박스 크기를 화면 폭(vw)에 맞춰서, 어떤 휴대폰에서도 스크롤 없이 한 화면에 */
  .wrap{position:relative;padding:3vw 4.5vw 3vw}
  .brand{text-align:center;font-size:3.6vw;font-weight:700;letter-spacing:.3vw;color:#8a93a1;margin-bottom:1vw}
  h1{margin:0;font-size:9vw;text-align:center;letter-spacing:-.3vw;line-height:1.2}
  .date{text-align:center;color:var(--sub);font-size:4.4vw;margin:1vw 0 5vw}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4vw}
  .room{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:44vw;border-radius:5vw;border:0;padding:2vw;cursor:pointer;
    font:inherit;color:#fff;box-shadow:0 .8vw 2vw rgba(0,0,0,.15)}
  .room:active{transform:scale(.97)}
  .room .ic{font-size:13vw;line-height:1;margin-bottom:2.5vw}
  .room .nm{font-size:7vw;font-weight:700;line-height:1.2;text-align:center}
  .coil{background:#d9730d}
  .work{background:#1f6fb2}
  .wait{background:var(--wait);color:var(--waitink);box-shadow:none;border:.8vw dashed #c3c9d2}
  .wait .nm{font-size:6vw}
  /* v7: 설정은 오른쪽 위 톱니바퀴 아이콘만 */
  .gear{position:absolute;top:2.5vw;right:3vw;width:11vw;height:11vw;display:flex;align-items:center;justify-content:center;
    border:0;border-radius:50%;background:transparent;color:#5b6677;font:inherit;font-size:7.5vw;line-height:1;cursor:pointer;padding:0}
  .gear:active{transform:scale(.97)}
  .help{display:flex;align-items:center;justify-content:center;gap:2vw;margin-top:4vw;height:8vw;border-radius:2.5vw;
    background:#2e7d32;color:#fff;text-decoration:none;box-shadow:0 .8vw 2vw rgba(0,0,0,.15)}
  .help:active{transform:scale(.97)}
  .help .ph{font-size:4.2vw;line-height:1}
  .help .tx{font-size:3.8vw;font-weight:700;letter-spacing:.1vw}
  button.help{width:100%;border:0;font:inherit;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:6vw;transform:translateX(-50%);white-space:nowrap;
    background:#1d2430;color:#fff;padding:3.5vw 6vw;border-radius:3vw;font-size:5vw;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  /* 앱으로 설치 (홈 화면 아이콘) */
  .inst{display:none;width:100%;margin-top:5vw;height:12vw;border:0;border-radius:3vw;background:#1d2430;color:#fff;
    font:inherit;font-size:5vw;font-weight:700;cursor:pointer;box-shadow:0 .8vw 2vw rgba(0,0,0,.15)}
  .inst.on{display:block}
  .inst:active{transform:scale(.97)}
  /* v6: 한 번 로그인 (대문에서 이름+PIN → 작업기록·코일 관리 둘 다 들어가짐) */
  .me{position:absolute;top:3.5vw;left:3vw;max-width:40vw;height:9vw;padding:0 3vw;border:0;border-radius:4.5vw;background:#e3e6eb;color:#1d2430;
    font:inherit;font-size:4vw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:none}
  .me.on{display:block}
  .lg{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column;justify-content:center;padding:0 8vw}
  .lg.on{display:flex}
  .lg h2{margin:0 0 1vw;font-size:8vw;text-align:center}
  .lg .s{color:var(--sub);text-align:center;font-size:4.2vw;margin-bottom:6vw;line-height:1.5}
  .lg label{display:block;font-size:4.4vw;font-weight:700;margin:3vw 0 1.5vw}
  .lg input{width:100%;height:13vw;border:.5vw solid #c3c9d2;border-radius:3vw;padding:0 4vw;font:inherit;font-size:5.5vw;background:#fff}
  .lg .go{width:100%;height:14vw;margin-top:6vw;border:0;border-radius:3vw;background:#1f6fb2;color:#fff;font:inherit;font-size:6vw;font-weight:700}
  .lg .go:disabled{opacity:.6}
  .lg .err{color:#c62828;font-size:4.2vw;min-height:6vw;margin-top:3vw;text-align:center;line-height:1.4}
  .lg .sub2{width:100%;height:12vw;margin-top:3vw;border:0;border-radius:3vw;background:#e3e6eb;color:#1d2430;font:inherit;font-size:5vw;font-weight:700}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .sheet.on{display:flex}
  .sheet .box{background:#fff;width:100%;border-radius:5vw 5vw 0 0;padding:6vw 6vw 8vw;font-size:4.6vw;line-height:1.6}
  .sheet h2{margin:0 0 3vw;font-size:5.6vw}
  .sheet ol{margin:0;padding-left:6vw}
  .sheet button{margin-top:5vw;width:100%;height:11vw;border:0;border-radius:3vw;background:#1f6fb2;color:#fff;font:inherit;font-size:4.8vw;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <button class="gear" id="gear" data-url="./settings/" aria-label="설정" title="설정 (운영자)" style="display:none">⚙</button>
  <button class="me" id="meBtn">👤</button>
  <div class="brand">POSCO GY솔루션</div>
  <h1>🔧 권선 작업실</h1>
  <div class="date" id="d"></div>
  <div class="grid">
    <button class="room coil" data-url="./coil/">
      <span class="ic">🧵</span><span class="nm">코일 관리</span></button>
    <button class="room work" data-url="./worklog/">
      <span class="ic">📒</span><span class="nm">작업기록</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
    <button class="room wait"><span class="ic">🚧</span><span class="nm">작업 중</span></button>
  </div>
  <button class="inst" id="inst">📲 휴대폰에 앱으로 설치</button>
  <!-- v8: Help Desk — 번호는 구글 서버(설정방)에만 있고, 로그인한 사람이 누를 때만 받아서 전화를 겁니다 -->
  <button class="help" id="helpBtn" style="display:none"><span class="ph">📞</span><span class="tx">Help Desk</span></button>
</div>
<div class="toast" id="t">아직 만드는 중입니다</div>
<!-- v6: 로그인 화면 (처음 한 번). 여기서 들어가면 작업기록·코일 관리에서 다시 묻지 않음 -->
<div class="lg" id="lg">
  <form id="lgForm" autocomplete="on" onsubmit="return false">
    <h2>🔧 권선 작업실</h2>
    <div class="s">이름과 PIN을 한 번만 넣으면<br>작업기록·코일 관리 모두 들어가집니다.</div>
    <label for="lgName">이름</label><input id="lgName" autocomplete="username">
    <label for="lgPin">PIN (숫자)</label><input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="go" id="lgGo" type="submit">들어가기</button>
    <div class="err" id="lgErr"></div>
  </form>
  <form id="pnForm" onsubmit="return false" style="display:none">
    <h2>🔑 새 PIN 정하기</h2>
    <div class="s" id="pnNote">나만 아는 숫자(4~8자리)로 바꿔 주세요.<br>바꾼 PIN은 작업기록·코일 관리 모두 같습니다.</div>
    <div id="pnOldWrap"><label for="pnOld">지금 PIN</label><input id="pnOld" type="password" inputmode="numeric" autocomplete="current-password"></div>
    <label for="pnNew">새 PIN</label><input id="pnNew" type="password" inputmode="numeric" autocomplete="new-password">
    <label for="pnNew2">새 PIN 한 번 더</label><input id="pnNew2" type="password" inputmode="numeric" autocomplete="new-password">
    <button class="go" id="pnGo" type="submit">PIN 바꾸기</button>
    <button class="sub2" id="pnCancel" type="button">닫기</button>
    <div class="err" id="pnErr"></div>
  </form>
</div>
<div class="sheet" id="meSheet"><div class="box">
  <h2 id="meTitle">👤</h2>
  <button id="mePin">🔑 PIN 바꾸기</button>
  <button id="meOut" style="background:#c62828">로그아웃 (작업기록·코일 모두)</button>
  <button id="meClose" style="background:#e3e6eb;color:#1d2430">닫기</button>
</div></div>
<div class="sheet" id="sheet"><div class="box">
  <h2>📲 아이폰에 설치하기</h2>
  <ol>
    <li>사파리 맨 아래 가운데 <b>공유 버튼(네모에 위 화살표 ⬆)</b>을 누릅니다.</li>
    <li>목록을 올려서 <b>홈 화면에 추가</b>를 누릅니다.</li>
    <li>오른쪽 위 <b>추가</b>를 누르면 홈 화면에 '권선 작업실' 아이콘이 생깁니다.</li>
  </ol>
  <button id="sheetOk">알겠어요</button>
</div></div>
<script src="auth.js"></script>
<script>
  var n=new Date(),w='일월화수목금토';
  document.getElementById('d').textContent=(n.getMonth()+1)+'월 '+n.getDate()+'일 ('+w[n.getDay()]+')';
  var t=document.getElementById('t'),tm;
  function go(u){
    try{ window.top.location.href=u; }
    catch(e){ window.open(u,'_blank'); }
  }
  document.querySelectorAll('.room,.gear').forEach(function(b){
    b.addEventListener('click',function(){
      var u=b.getAttribute('data-url');
      if(u){ go(u); return; }
      t.classList.add('on'); clearTimeout(tm); tm=setTimeout(function(){t.classList.remove('on')},1500);
    });
  });
  // ── 앱으로 설치: 안드로이드 크롬은 버튼 한 번, 아이폰은 방법 안내. 이미 앱으로 열었으면 버튼 숨김
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ib = document.getElementById('inst'), sh = document.getElementById('sheet'), dp = null;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; if (!standalone) ib.classList.add('on'); });
  window.addEventListener('appinstalled', function () { ib.classList.remove('on'); dp = null; });
  if (ios && !standalone) ib.classList.add('on');
  ib.addEventListener('click', function () {
    if (dp) { dp.prompt(); dp.userChoice.then(function () { dp = null; ib.classList.remove('on'); }); return; }
    if (ios) { sh.classList.add('on'); return; }
    t.textContent = '크롬 메뉴(⋮) → 홈 화면에 추가'; t.classList.add('on'); clearTimeout(tm); tm = setTimeout(function () { t.classList.remove('on'); t.textContent = '아직 만드는 중입니다'; }, 3500);
  });
  document.getElementById('sheetOk').addEventListener('click', function () { sh.classList.remove('on'); });
  // ── v6: 한 번 로그인 ──
  var $=function(i){return document.getElementById(i);}, lg=$('lg'), pinTmp='';
  // ⚙ 설정방은 운영자만 (아직 설정방 출입증이 없으면 일단 보여 줌 — 들어가면 설정방이 다시 확인)
  function showMe(){ var nm=GW.name(); $('meBtn').textContent='👤 '+nm; $('meBtn').classList.add('on'); $('gear').style.display=(GW.isSup()||!GW.stToken())?'':'none'; }
  function showLogin(msg){ $('meBtn').classList.remove('on'); $('gear').style.display='none'; $('lgForm').style.display=''; $('pnForm').style.display='none';
    $('lgName').value=GW.name(); $('lgPin').value=''; $('lgErr').textContent=msg||''; lg.classList.add('on'); }
  function showPin(force){ $('lgForm').style.display='none'; $('pnForm').style.display='';
    ['pnOld','pnNew','pnNew2'].forEach(function(i){$(i).value='';}); $('pnErr').textContent='';
    var hasTmp=!!(force&&pinTmp); $('pnOld').value=hasTmp?pinTmp:''; $('pnOldWrap').style.display=hasTmp?'none':'';
    $('pnNote').innerHTML=(force?'관리자가 준 임시 PIN을 쓰고 있습니다.<br>':'')+'나만 아는 숫자(4~8자리)로 바꿔 주세요.<br>바꾼 PIN은 작업기록·코일 관리 모두 같습니다.';
    $('pnCancel').style.display=force?'none':''; lg.classList.add('on'); }
  $('lgForm').addEventListener('submit',function(){
    var nm=$('lgName').value.trim(), p=$('lgPin').value.trim(), b=$('lgGo');
    if(!nm||!p){ $('lgErr').textContent='이름과 PIN을 모두 넣어 주세요.'; return; }
    b.disabled=true; b.textContent='확인 중…'; $('lgErr').textContent='';
    GW.login(nm,p).then(function(r){
      showMe();
      if(r.mustChange){ pinTmp=p; showPin(true); } else lg.classList.remove('on');
    },function(e){ $('lgErr').textContent=e.message; }).then(function(){ b.disabled=false; b.textContent='들어가기'; });
  });
  $('pnForm').addEventListener('submit',function(){
    var o=$('pnOld').value.trim(), a=$('pnNew').value.trim(), a2=$('pnNew2').value.trim(), er=$('pnErr'), b=$('pnGo');
    if(!o){ er.textContent='지금 PIN을 넣어 주세요.'; return; }
    if(!/^\d{4,8}$/.test(a)){ er.textContent='새 PIN은 숫자 4~8자리로 넣어 주세요.'; return; }
    if(a!==a2){ er.textContent='새 PIN 두 번이 서로 다릅니다.'; return; }
    if(a===o){ er.textContent='지금 PIN과 다른 숫자로 정해 주세요.'; return; }
    b.disabled=true; er.textContent='바꾸는 중…';
    GW.changePin(GW.name(),o,a).then(function(){
      pinTmp=''; lg.classList.remove('on');
      t.textContent='✅ PIN을 바꿨습니다'; t.classList.add('on'); clearTimeout(tm); tm=setTimeout(function(){t.classList.remove('on'); t.textContent='아직 만드는 중입니다';},3000);
    },function(e){ er.textContent=e.message; $('pnOldWrap').style.display=''; }).then(function(){ b.disabled=false; });
  });
  $('pnCancel').addEventListener('click',function(){ lg.classList.remove('on'); });
  $('meBtn').addEventListener('click',function(){ $('meTitle').textContent='👤 '+GW.name(); $('meSheet').classList.add('on'); });
  $('meClose').addEventListener('click',function(){ $('meSheet').classList.remove('on'); });
  $('mePin').addEventListener('click',function(){ $('meSheet').classList.remove('on'); showPin(false); });
  $('meOut').addEventListener('click',function(){ if(!confirm('로그아웃할까요? 작업기록·코일 관리 모두 다시 이름과 PIN이 필요합니다.')) return;
    GW.logout(); $('meSheet').classList.remove('on'); showLogin(); });
  // ── v8: Help Desk 전화 (번호는 화면·저장소에 없음, 서버에서 받아 바로 걸기) ──
  var TEL='';
  function telFetch(){ var tk=GW.stToken(); if(!tk) return Promise.reject(new Error('다시 로그인해 주세요'));
    return GW.stPost('helpDesk',[tk]).then(function(r){ TEL=String(r&&r.tel||'').replace(/[^0-9+]/g,''); return TEL; }); }
  function helpShow(){ $('helpBtn').style.display=GW.loggedIn()?'':'none'; if(GW.loggedIn()&&!TEL) telFetch().catch(function(){}); }
  $('helpBtn').addEventListener('click',function(){
    if(TEL){ location.href='tel:'+TEL; return; }
    telFetch().then(function(n){ if(n) location.href='tel:'+n; },function(e){
      t.textContent=e.message||'잠시 뒤 다시 눌러 주세요'; t.classList.add('on'); clearTimeout(tm); tm=setTimeout(function(){t.classList.remove('on'); t.textContent='아직 만드는 중입니다';},3000); });
  });
  var _showMe=showMe; showMe=function(){ _showMe(); helpShow(); };
  var _showLogin=showLogin; showLogin=function(m){ _showLogin(m); TEL=''; helpShow(); };
  if(GW.loggedIn()) showMe(); else showLogin();
  // 방에서 돌아왔을 때(뒤로 가기) 로그인 상태 다시 확인
  window.addEventListener('pageshow',function(){ if(GW.loggedIn()){ showMe(); if($('lgForm').style.display!=='none') lg.classList.remove('on'); } else showLogin(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
