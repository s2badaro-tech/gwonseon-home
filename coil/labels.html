<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코일 QR 라벨</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
@page{size:A4;margin:8mm}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#eee;color:#000}
.bar{padding:12px;background:#1f5fae;color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar button{font-size:17px;padding:10px 16px;border:0;border-radius:8px;font-weight:700}
.page{width:194mm;margin:8px auto;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:39mm;gap:0}
.lb{border:1px dashed #bbb;padding:3mm 3mm 3mm 3.5mm;display:flex;align-items:center;gap:3mm;overflow:hidden}
.lb .q{width:32mm;height:32mm;flex:none;background:#fff}
.lb .q img,.lb .q svg{width:32mm;height:32mm;display:block}
.lb .no{font-size:24pt;font-weight:900;letter-spacing:1px;line-height:1}
.lb .sp{font-size:9pt;font-weight:700;margin-top:2mm;color:#222}
.lb .mk{font-size:8pt;color:#444;margin-top:1mm}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;break-after:page}}
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">🖨️ 인쇄</button><span id="cnt"></span><span style="font-size:13px">A4 한 장에 21개 · 점선을 따라 자르거나 21칸 라벨지(63.5×38.1mm)에 인쇄</span></div>
<div id="pages"></div>
<script>
// v6 (2026-11-27): Supabase 이전 — 라벨 화면도 깃허브에. 로그인한 휴대폰(출입증)으로만 타래 정보를 받음
var API = 'https://difrlthubqaoeqyprhhj.supabase.co/functions/v1/api';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function show(DATA, APP) {
  document.getElementById('cnt').textContent = DATA.length + '개';
  var html = '';
  for (var i = 0; i < DATA.length; i += 21) {
    html += '<div class="page">' + DATA.slice(i, i + 21).map(function (c) {
      var q = qrcode(0, 'M'); q.addData(APP + '?coil=' + encodeURIComponent(c.no)); q.make();
      return '<div class="lb"><div class="q">' + q.createSvgTag({ cellSize: 3, margin: 0, scalable: true }) + '</div><div><div class="no">' + esc(c.no) + '</div><div class="sp">' + esc(c.spec) + 'mm ' + esc(c.kind) + '</div>' + (c.w != null && c.w !== '' ? '<div class="sp" style="margin-top:1mm">' + esc(c.w) + 'kg</div>' : '') + '<div class="mk">' + esc(c.maker) + '</div></div></div>';
    }).join('') + '</div>';
  }
  document.getElementById('pages').innerHTML = html || '<p style="padding:20px">그 번호의 타래가 없습니다.</p>';
}
function msg(t) { document.getElementById('pages').innerHTML = '<p style="padding:20px;font-size:18px;background:#fff">' + esc(t) + '</p>'; }
var tok = null; try { tok = localStorage.getItem('coilinv_token'); } catch (e) {}
var nos = new URLSearchParams(location.search).get('nos') || '';
if (!tok) msg('코일 관리 앱에서 로그인한 뒤 라벨 버튼을 다시 눌러 주세요.');
else {
  msg('불러오는 중…');
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ app: 'co', fn: 'labelData', args: [tok, nos] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.ok) show(j.v.rows, j.v.appUrl); else msg(String((j && j.e) || '서버 응답이 이상합니다').replace('[로그인]', '')); },
      function () { msg('인터넷 연결을 확인해 주세요.'); });
}
</script>
</body>
</html>
